<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quasar SMP | Status</title>

    <!-- CSS Imports -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/status.css">

    <link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <nav>
        <a class="logo" href="/">
            <img src="/assets/images/logo.png" alt="Quasar SMP Logo">
            <h5>Quasar SMP</h5>
        </a>
        <input id="sidebar-check" type="checkbox">
        <label for="sidebar-check" id="sidebar-open">
           <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg> 
        </label>
        <label for="sidebar-check" id="sidebar-overlay"></label>
        <div class="nav-group">
            <label for="sidebar-check" id="sidebar-close">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
            </label>
            <ul class="nav-links">
                <li><a class="nav-link"href="/">Home</a></li>
                <li><a class="nav-link"href="/about/">About</a></li>
                <li><a class="nav-link"href="/status/">Status</a></li>
            </ul>
            <ul class="nav-btns">
                <li><a class="nav-btn"href="/join/">Join</a></li>
                <li><a class="nav-btn"href="/donate/">Donate</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <video id="background-video" src="/assets/videos/mc loop-compressed.mp4" autoplay muted loop playsinline></video>
        <div class="status-card">
                <img id="status-server-img" class="server-logo" src="/assets/images/server-offline.jpg">
                <div class="text">
                    <div class="main">
                        <h2 id="status-server-address">No server address</h2>
                        <p>
                            <span id="status-plugin-loader">No loader</span>・
                            <span id="status-server-version">No version</span>・
                            <span id="status-current-players">No players</span>/<span id="status-max-players">No max</span>
                        </p>
                    </div>
                    <div id="status-status" class="offline">
                        <span class="dot"></span>
                        <span id="status-text">Offline</span>
                    </div>
                </div>
        </div>
    </main>

    <script src="/js/pages/status/background.js"></script>
    <script src="/js/pages/status/status.js"></script>
</body>
</html>
